name: Build Lucky Pull Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckypull-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Godot 4.3 tests and Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.3
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$(dirname "${TEMPLATE_TARGET}")" "${HOME}/.config"
          if [[ -d "${TEMPLATE_SOURCE}" && "${TEMPLATE_SOURCE}" != "${TEMPLATE_TARGET}" ]]; then
            cp -a "${TEMPLATE_SOURCE}" "${TEMPLATE_TARGET}"
          fi
          if [[ -d /root/.config/godot && ! -d "${HOME}/.config/godot" ]]; then
            cp -a /root/.config/godot "${HOME}/.config/godot"
          fi
          command -v godot
          godot --version
          java -version
          if ! command -v python3 >/dev/null || ! command -v xz >/dev/null || ! command -v patch >/dev/null; then
            apt-get update
            apt-get install -y python3 xz-utils patch zip unzip
          fi
          command -v python3
          command -v xz
          command -v patch
          command -v zip
          command -v unzip
          keytool -help >/dev/null 2>&1
          test -f "${TEMPLATE_TARGET}/android_debug.apk"

      - name: Reconstruct verified v0.4.4 base
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode project-payload/LuckyPull_Godot4_v0.4.4.tar.gz.b64 > "${RUNNER_TEMP}/luckypull-v044.tar.gz"
          echo "f80f6bd32348615974311ff8584f882485876e473e417f97aba03e55f9dce4a0  ${RUNNER_TEMP}/luckypull-v044.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/luckypull-v044.tar.gz" -C "${RUNNER_TEMP}"
          test -f "${RUNNER_TEMP}/LuckyPull_Godot4/project.godot"
          mkdir -p "${GITHUB_WORKSPACE}/.build-source"
          cp -a "${RUNNER_TEMP}/LuckyPull_Godot4" "${GITHUB_WORKSPACE}/.build-source/"
          echo "PROJECT_DIR=${GITHUB_WORKSPACE}/.build-source/LuckyPull_Godot4" >> "${GITHUB_ENV}"

      - name: Apply v0.6.0 source update
        shell: bash
        run: |
          set -euo pipefail
          cat \
            project-payload/LuckyPull_v0.6.0.patch.xz.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-02.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-03.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-04.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-05.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-06.b64 \
            > "${RUNNER_TEMP}/luckypull-v060.patch.xz.b64"
          base64 --decode "${RUNNER_TEMP}/luckypull-v060.patch.xz.b64" > "${RUNNER_TEMP}/luckypull-v060.patch.xz"
          xz --test "${RUNNER_TEMP}/luckypull-v060.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/luckypull-v060.patch.xz" > "${RUNNER_TEMP}/luckypull-v060.patch"
          cd "${PROJECT_DIR}"
          patch --batch --forward -p1 < "${RUNNER_TEMP}/luckypull-v060.patch"
          grep -q '^config/version="0.6.0"$' project.godot
          grep -q '^version/name="0.6.0"$' export_presets.cfg
          grep -q '^version/code=12$' export_presets.cfg
          grep -q '^const SAVE_VERSION := 8$' scripts/game_state.gd

      - name: Apply Godot runtime fixes discovered by CI
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode project-payload/LuckyPull_v0.6.0_runtime_fixes.patch.xz.b64 > "${RUNNER_TEMP}/luckypull-runtime-fixes.patch.xz"
          xz --test "${RUNNER_TEMP}/luckypull-runtime-fixes.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/luckypull-runtime-fixes.patch.xz" > "${RUNNER_TEMP}/luckypull-runtime-fixes.patch"
          cd "${PROJECT_DIR}"
          patch --batch --forward -p2 < "${RUNNER_TEMP}/luckypull-runtime-fixes.patch"

      - name: Generate original offline sound effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math
          import os
          import struct
          import wave
          from pathlib import Path

          audio_dir = Path(os.environ["PROJECT_DIR"]) / "assets" / "audio"
          audio_dir.mkdir(parents=True, exist_ok=True)
          sample_rate = 22050

          def write_sound(filename, notes, duration, waveform="sine", volume=0.18):
              count = int(sample_rate * duration)
              data = bytearray()
              for index in range(count):
                  now = index / sample_rate
                  value = 0.0
                  for start, frequency in notes:
                      local = now - start
                      if 0 <= local < duration - start:
                          phase = (frequency * local) % 1.0
                          if waveform == "triangle":
                              sample = 1.0 - 4.0 * abs(phase - 0.5)
                          else:
                              sample = math.sin(2.0 * math.pi * phase)
                          value += sample / len(notes)
                  attack = min(1.0, index / max(1, int(sample_rate * 0.012)))
                  release = min(1.0, (count - index) / max(1, int(sample_rate * 0.055)))
                  value *= volume * max(0.0, min(attack, release))
                  data.extend(struct.pack("<h", int(max(-1.0, min(1.0, value)) * 32767)))
              with wave.open(str(audio_dir / filename), "wb") as stream:
                  stream.setnchannels(1)
                  stream.setsampwidth(2)
                  stream.setframerate(sample_rate)
                  stream.writeframes(bytes(data))

          write_sound("ui_tap.wav", [(0.0, 740)], 0.065, volume=0.12)
          write_sound("reward.wav", [(0.0, 660), (0.12, 830), (0.25, 990), (0.38, 1320)], 0.56)
          write_sound("victory.wav", [(0.0, 523), (0.14, 659), (0.28, 784), (0.45, 1046)], 0.72, waveform="triangle")
          PY
          test -s "${PROJECT_DIR}/assets/audio/ui_tap.wav"
          test -s "${PROJECT_DIR}/assets/audio/reward.wav"
          test -s "${PROJECT_DIR}/assets/audio/victory.wav"

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          sed -i -E 's|^gradle_build/min_sdk=.*$|gradle_build/min_sdk=""|' export_presets.cfg
          sed -i -E 's|^gradle_build/target_sdk=.*$|gradle_build/target_sdk=""|' export_presets.cfg
          grep -q '^textures/vram_compression/import_etc2_astc=' project.godot || sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          sed -i 's/five active offline daily missions/six active offline daily missions/' tests/save_recovery_test.gd
          sed -i 's/"spell_daily_casts", 0)) != 3/"spell_daily_casts", 0)) != 4/' tests/save_recovery_test.gd
          rm -rf .godot/imported
          godot --headless --editor --path . --quit
          test -s assets/fonts/NotoSansArabic-Regular.ttf
          test -s assets/fonts/NotoSansArabic-SemiBold.ttf
          test -s assets/fonts/NotoSansArabic-Bold.ttf
          test -s assets/fonts/NotoSansSymbols2-Regular.ttf
          grep -q 'theme/default_font="res://assets/fonts/NotoSansArabic-Regular.ttf"' project.godot
          grep -q '^permissions/internet=false$' export_presets.cfg
          grep -q 'CARD_SETS' scripts/game_state.gd
          grep -q 'get_base_odds' scripts/game_state.gd
          grep -q 'SEASON_REWARDS' scripts/game_state.gd
          grep -q 'LEGENDARY_CHEST_GEM_COST' scripts/game_state.gd
          grep -q 'spell_daily_casts' scripts/game_state.gd
          grep -q 'func purchase_cosmetic' scripts/game_state.gd
          grep -q 'func save_game' scripts/game_state.gd
          grep -q 'Spell Chain' scripts/main.gd
          grep -q 'Tower Bastion' scripts/main.gd
          grep -q 'Cat Squadron' scripts/main.gd
          grep -q 'SFX_TAP' scripts/main.gd
          grep -q 'vibration_enabled' scripts/main.gd
          ! grep -q 'ad_1' scripts/game_state.gd
          test -s tests/save_recovery_test.gd
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/save_recovery_test.gd")
          source = path.read_text(encoding="utf-8")
          replacements = [
              ("    var arcade_state = state_script.new()", "    print(\"TRACE_ARCADE_01: before state instance\")\n    var arcade_state = state_script.new()"),
              ("    arcade_state.load_game()\n    var arcade_migrated", "    arcade_state.load_game()\n    print(\"TRACE_ARCADE_02: after load_game\")\n    var arcade_migrated"),
              ("    arcade_state.arcade = arcade_state._normalize_arcade_data({})", "    arcade_state.arcade = arcade_state._normalize_arcade_data({})\n    print(\"TRACE_ARCADE_03: after normalize\")"),
              ("    var spell_start: Dictionary = arcade_state.start_spell_run()", "    print(\"TRACE_ARCADE_04: before spell start\")\n    var spell_start: Dictionary = arcade_state.start_spell_run()\n    print(\"TRACE_ARCADE_05: after spell start\")"),
              ("    var spell_win: Dictionary = arcade_state.cast_spell(\"fire\")", "    print(\"TRACE_ARCADE_06: before winning cast\")\n    var spell_win: Dictionary = arcade_state.cast_spell(\"fire\")\n    print(\"TRACE_ARCADE_07: after winning cast\")"),
              ("    var spell_mana_start: Dictionary = arcade_state.start_spell_run()", "    print(\"TRACE_ARCADE_08: before retry\")\n    var spell_mana_start: Dictionary = arcade_state.start_spell_run()\n    print(\"TRACE_ARCADE_09: after retry\")"),
              ("        var cast_result: Dictionary = arcade_state.cast_spell(spell_element)", "        print(\"TRACE_ARCADE_10: before cast \" + spell_element)\n        var cast_result: Dictionary = arcade_state.cast_spell(spell_element)\n        print(\"TRACE_ARCADE_11: after cast \" + spell_element)")
              ("    if int(arcade_state.arcade.get(\"spell_daily_casts\", 0)) != 4:", "    print(\"TRACE_ARCADE_12: before daily cast count assertion\")\n    if int(arcade_state.arcade.get(\"spell_daily_casts\", 0)) != 4:"),
              ("    var spell_daily_info: Dictionary = arcade_state.daily_mission_info(\"spell_3\")", "    print(\"TRACE_ARCADE_13: before daily mission info\")\n    var spell_daily_info: Dictionary = arcade_state.daily_mission_info(\"spell_3\")\n    print(\"TRACE_ARCADE_14: after daily mission info\")"),
              ("    arcade_state.arcade[\"spell_mana\"] = 10", "    print(\"TRACE_ARCADE_15: before mana setup\")\n    arcade_state.arcade[\"spell_mana\"] = 10"),
              ("    var mana_recovery: Dictionary = arcade_state.recover_spell_mana()", "    print(\"TRACE_ARCADE_16: before mana recovery\")\n    var mana_recovery: Dictionary = arcade_state.recover_spell_mana()\n    print(\"TRACE_ARCADE_17: after mana recovery\")"),
              ("    var tower_upgrade: Dictionary = arcade_state.upgrade_tower(\"damage\")", "    print(\"TRACE_ARCADE_18: before tower upgrade\")\n    var tower_upgrade: Dictionary = arcade_state.upgrade_tower(\"damage\")\n    print(\"TRACE_ARCADE_19: after tower upgrade\")"),
              ("    var tower_wave: Dictionary = arcade_state.defend_tower_wave()", "    print(\"TRACE_ARCADE_20: before tower wave\")\n    var tower_wave: Dictionary = arcade_state.defend_tower_wave()\n    print(\"TRACE_ARCADE_21: after tower wave\")"),
              ("    var cat_buy: Dictionary = arcade_state.buy_cat_weapon()", "    print(\"TRACE_ARCADE_22: before cat buy\")\n    var cat_buy: Dictionary = arcade_state.buy_cat_weapon()\n    print(\"TRACE_ARCADE_23: after cat buy\")"),
              ("    var cat_merge: Dictionary = arcade_state.merge_cat_weapons(1)", "    print(\"TRACE_ARCADE_24: before cat merge\")\n    var cat_merge: Dictionary = arcade_state.merge_cat_weapons(1)\n    print(\"TRACE_ARCADE_25: after cat merge\")"),
              ("    var idle_claim: Dictionary = arcade_state.collect_cat_idle(test_now)", "    print(\"TRACE_ARCADE_26: before cat idle collect\")\n    var idle_claim: Dictionary = arcade_state.collect_cat_idle(test_now)\n    print(\"TRACE_ARCADE_27: after cat idle collect\")")
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit("Missing instrumentation anchor: " + old.splitlines()[0])
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Run automated game and save tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          godot --headless --path . --script res://tests/save_recovery_test.gd

      - name: Upload reconstructed source for test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuckyPull-v0.6.0-Reconstructed-Source
          path: .build-source/LuckyPull_Godot4
          if-no-files-found: error
          retention-days: 7

      - name: Launch main game scene
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          godot --headless --path . --quit-after 5

      - name: Create temporary Android debug key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -v \
            -keystore "${RUNNER_TEMP}/luckypull-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Lucky Pull,C=IQ"

      - name: Export and verify APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/luckypull-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" "build/LuckyPull-Android-v0.6.0.apk"
          test -s build/LuckyPull-Android-v0.6.0.apk
          unzip -t build/LuckyPull-Android-v0.6.0.apk >/dev/null
          APK_SHA256="$(sha256sum build/LuckyPull-Android-v0.6.0.apk | awk '{print $1}')"
          APK_SIGNER=""
          if [[ -n "${ANDROID_HOME:-}" && -x "${ANDROID_HOME}/build-tools/34.0.0/apksigner" ]]; then
            APK_SIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          elif command -v apksigner >/dev/null 2>&1; then
            APK_SIGNER="$(command -v apksigner)"
          else
            APK_SIGNER="$(find /root /opt /usr/lib -type f -name apksigner -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          test -n "${APK_SIGNER}"
          "${APK_SIGNER}" verify --verbose build/LuckyPull-Android-v0.6.0.apk
          printf '### Lucky Pull 0.6.0 APK\n\n- Godot import, automated tests, scene launch: passed\n- APK export and signature verification: passed\n- SHA-256: `%s`\n' "${APK_SHA256}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload installable APK only
        uses: actions/upload-artifact@v4
        with:
          name: LuckyPull-v0.6.0-Android-Debug-APK
          path: .build-source/LuckyPull_Godot4/build/LuckyPull-Android-v0.6.0.apk
          if-no-files-found: error
          retention-days: 30
