name: Build NEXORA Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Godot 4.3 tests and NEXORA Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.3
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$(dirname "${TEMPLATE_TARGET}")" "${HOME}/.config"
          if [[ -d "${TEMPLATE_SOURCE}" && "${TEMPLATE_SOURCE}" != "${TEMPLATE_TARGET}" ]]; then
            cp -a "${TEMPLATE_SOURCE}" "${TEMPLATE_TARGET}"
          fi
          if [[ -d /root/.config/godot && ! -d "${HOME}/.config/godot" ]]; then
            cp -a /root/.config/godot "${HOME}/.config/godot"
          fi
          command -v godot
          godot --version
          java -version
          if ! command -v python3 >/dev/null || ! command -v xz >/dev/null || ! command -v patch >/dev/null; then
            apt-get update
            apt-get install -y python3 xz-utils patch zip unzip
          fi
          command -v python3
          command -v xz
          command -v patch
          command -v zip
          command -v unzip
          keytool -help >/dev/null 2>&1
          test -f "${TEMPLATE_TARGET}/android_debug.apk"

      - name: Reconstruct verified v0.4.4 base
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode project-payload/LuckyPull_Godot4_v0.4.4.tar.gz.b64 > "${RUNNER_TEMP}/luckypull-v044.tar.gz"
          echo "f80f6bd32348615974311ff8584f882485876e473e417f97aba03e55f9dce4a0  ${RUNNER_TEMP}/luckypull-v044.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/luckypull-v044.tar.gz" -C "${RUNNER_TEMP}"
          test -f "${RUNNER_TEMP}/LuckyPull_Godot4/project.godot"
          mkdir -p "${GITHUB_WORKSPACE}/.build-source"
          cp -a "${RUNNER_TEMP}/LuckyPull_Godot4" "${GITHUB_WORKSPACE}/.build-source/"
          echo "PROJECT_DIR=${GITHUB_WORKSPACE}/.build-source/LuckyPull_Godot4" >> "${GITHUB_ENV}"

      - name: Apply v0.6.0 source update
        shell: bash
        run: |
          set -euo pipefail
          cat \
            project-payload/LuckyPull_v0.6.0.patch.xz.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-02.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-03.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-04.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-05.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-06.b64 \
            > "${RUNNER_TEMP}/luckypull-v060.patch.xz.b64"
          base64 --decode "${RUNNER_TEMP}/luckypull-v060.patch.xz.b64" > "${RUNNER_TEMP}/luckypull-v060.patch.xz"
          xz --test "${RUNNER_TEMP}/luckypull-v060.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/luckypull-v060.patch.xz" > "${RUNNER_TEMP}/luckypull-v060.patch"
          cd "${PROJECT_DIR}"
          patch --batch --forward -p1 < "${RUNNER_TEMP}/luckypull-v060.patch"
          grep -q '^config/version="0.6.0"$' project.godot
          grep -q '^version/name="0.6.0"$' export_presets.cfg
          grep -q '^version/code=12$' export_presets.cfg
          grep -q '^const SAVE_VERSION := 8$' scripts/game_state.gd

      - name: Apply Godot runtime fixes discovered by CI
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode project-payload/LuckyPull_v0.6.0_runtime_fixes.patch.xz.b64 > "${RUNNER_TEMP}/luckypull-runtime-fixes.patch.xz"
          xz --test "${RUNNER_TEMP}/luckypull-runtime-fixes.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/luckypull-runtime-fixes.patch.xz" > "${RUNNER_TEMP}/luckypull-runtime-fixes.patch"
          cd "${PROJECT_DIR}"
          patch --batch --forward -p2 < "${RUNNER_TEMP}/luckypull-runtime-fixes.patch"

      - name: Generate original offline sound effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math
          import os
          import struct
          import wave
          from pathlib import Path

          audio_dir = Path(os.environ["PROJECT_DIR"]) / "assets" / "audio"
          audio_dir.mkdir(parents=True, exist_ok=True)
          sample_rate = 22050

          def write_sound(filename, notes, duration, waveform="sine", volume=0.18):
              count = int(sample_rate * duration)
              data = bytearray()
              for index in range(count):
                  now = index / sample_rate
                  value = 0.0
                  for start, frequency in notes:
                      local = now - start
                      if 0 <= local < duration - start:
                          phase = (frequency * local) % 1.0
                          if waveform == "triangle":
                              sample = 1.0 - 4.0 * abs(phase - 0.5)
                          else:
                              sample = math.sin(2.0 * math.pi * phase)
                          value += sample / len(notes)
                  attack = min(1.0, index / max(1, int(sample_rate * 0.012)))
                  release = min(1.0, (count - index) / max(1, int(sample_rate * 0.055)))
                  value *= volume * max(0.0, min(attack, release))
                  data.extend(struct.pack("<h", int(max(-1.0, min(1.0, value)) * 32767)))
              with wave.open(str(audio_dir / filename), "wb") as stream:
                  stream.setnchannels(1)
                  stream.setsampwidth(2)
                  stream.setframerate(sample_rate)
                  stream.writeframes(bytes(data))

          write_sound("ui_tap.wav", [(0.0, 740)], 0.065, volume=0.12)
          write_sound("reward.wav", [(0.0, 660), (0.12, 830), (0.25, 990), (0.38, 1320)], 0.56)
          write_sound("victory.wav", [(0.0, 523), (0.14, 659), (0.28, 784), (0.45, 1046)], 0.72, waveform="triangle")
          PY
          test -s "${PROJECT_DIR}/assets/audio/ui_tap.wav"
          test -s "${PROJECT_DIR}/assets/audio/reward.wav"
          test -s "${PROJECT_DIR}/assets/audio/victory.wav"

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          sed -i -E 's|^gradle_build/min_sdk=.*$|gradle_build/min_sdk=""|' export_presets.cfg
          sed -i -E 's|^gradle_build/target_sdk=.*$|gradle_build/target_sdk=""|' export_presets.cfg
          grep -q '^textures/vram_compression/import_etc2_astc=' project.godot || sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          sed -i 's/five active offline daily missions/six active offline daily missions/' tests/save_recovery_test.gd
          sed -i 's/"spell_daily_casts", 0)) != 3/"spell_daily_casts", 0)) != 4/' tests/save_recovery_test.gd
          rm -rf .godot/imported
          godot --headless --editor --path . --quit
          test -s assets/fonts/NotoSansArabic-Regular.ttf
          test -s assets/fonts/NotoSansArabic-SemiBold.ttf
          test -s assets/fonts/NotoSansArabic-Bold.ttf
          test -s assets/fonts/NotoSansSymbols2-Regular.ttf
          grep -q 'theme/default_font="res://assets/fonts/NotoSansArabic-Regular.ttf"' project.godot
          grep -q '^permissions/internet=false$' export_presets.cfg
          grep -q 'CARD_SETS' scripts/game_state.gd
          grep -q 'get_base_odds' scripts/game_state.gd
          grep -q 'SEASON_REWARDS' scripts/game_state.gd
          grep -q 'LEGENDARY_CHEST_GEM_COST' scripts/game_state.gd
          grep -q 'spell_daily_casts' scripts/game_state.gd
          grep -q 'func purchase_cosmetic' scripts/game_state.gd
          grep -q 'func save_game' scripts/game_state.gd
          grep -q 'Spell Chain' scripts/main.gd
          grep -q 'Tower Bastion' scripts/main.gd
          grep -q 'Cat Squadron' scripts/main.gd
          grep -q 'SFX_TAP' scripts/main.gd
          grep -q 'vibration_enabled' scripts/main.gd
          ! grep -q 'ad_1' scripts/game_state.gd
          test -s tests/save_recovery_test.gd
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/save_recovery_test.gd")
          source = path.read_text(encoding="utf-8")
          duplicate_free_block = "    shop_reload.free()\n    collection_state.free()\n    migration_v7_state.free()\n    arcade_state.free()"
          if duplicate_free_block in source:
              source = source.replace(duplicate_free_block, "    shop_reload.free()\n    arcade_state.free()", 1)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Apply v0.8.0 redesign and campaign fixes
        shell: bash
        run: |
          set -euo pipefail
          cat project-payload/LuckyPull_v0.8.0.patch.xz.b64.part-01 project-payload/LuckyPull_v0.8.0.patch.xz.b64.part-02a project-payload/LuckyPull_v0.8.0.patch.xz.b64.part-02b project-payload/LuckyPull_v0.8.0.patch.xz.b64.part-03 project-payload/LuckyPull_v0.8.0.patch.xz.b64.part-04 project-payload/LuckyPull_v0.8.0.patch.xz.b64.part-05 project-payload/LuckyPull_v0.8.0.patch.xz.b64.part-06 project-payload/LuckyPull_v0.8.0.patch.xz.b64.part-07 > "${RUNNER_TEMP}/luckypull-v080.patch.xz.b64"
          base64 --decode "${RUNNER_TEMP}/luckypull-v080.patch.xz.b64" > "${RUNNER_TEMP}/luckypull-v080.patch.xz"
          echo "bea1e539b9b5fdd4beff89bb41bb68b097f1f5d20ac5a5569afeac6c99f90a3f  ${RUNNER_TEMP}/luckypull-v080.patch.xz" | sha256sum --check -
          xz --test "${RUNNER_TEMP}/luckypull-v080.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/luckypull-v080.patch.xz" > "${RUNNER_TEMP}/luckypull-v080.patch"
          cd "${PROJECT_DIR}"
          patch --batch --forward -p1 < "${RUNNER_TEMP}/luckypull-v080.patch"
          patch --batch --forward -p1 < "${GITHUB_WORKSPACE}/project-payload/LuckyPull_v0.8.0-translation-fix.patch"
          cat "${GITHUB_WORKSPACE}/project-payload/LuckyPull_v0.8.0-app-icon.b64.part-01" "${GITHUB_WORKSPACE}/project-payload/LuckyPull_v0.8.0-app-icon.b64.part-02" "${GITHUB_WORKSPACE}/project-payload/LuckyPull_v0.8.0-app-icon.b64.part-03" "${GITHUB_WORKSPACE}/project-payload/LuckyPull_v0.8.0-app-icon.b64.part-04" > "${RUNNER_TEMP}/luckypull-icon.b64"
          base64 --decode "${RUNNER_TEMP}/luckypull-icon.b64" > "${RUNNER_TEMP}/luckypull-icon.png"
          echo "89333f6e53f4f1dc7b90fbc1b4cde79024dd32c2bad1e0b32e80d48bf6eb5bd4  ${RUNNER_TEMP}/luckypull-icon.png" | sha256sum --check -
          install -m 0644 "${RUNNER_TEMP}/luckypull-icon.png" "${PROJECT_DIR}/assets/app_icon.png"
          grep -qx 'config/version="0.8.0"' project.godot
          grep -qx 'version/name="0.8.0"' export_presets.cfg
          grep -qx 'version/code=15' export_presets.cfg
          grep -qx 'permissions/internet=false' export_presets.cfg

      - name: Apply NEXORA 0.9.0 — Worlds United rebrand
        shell: bash
        run: |
          set -euo pipefail
          cat \
            project-payload/NEXORA_v0.9.0_rebrand.patch.xz.b64 \
            project-payload/NEXORA_v0.9.0_rebrand.patch.xz.b64.part-01a \
            project-payload/NEXORA_v0.9.0_rebrand.patch.xz.b64.part-01b \
            project-payload/NEXORA_v0.9.0_rebrand.patch.xz.b64.part-01c \
            project-payload/NEXORA_v0.9.0_rebrand.patch.xz.b64.part-02 \
            project-payload/NEXORA_v0.9.0_rebrand.patch.xz.b64.part-03 \
            project-payload/NEXORA_v0.9.0_rebrand.patch.xz.b64.part-04 \
            > "${RUNNER_TEMP}/nexora-v090.patch.xz.b64"
          base64 --decode "${RUNNER_TEMP}/nexora-v090.patch.xz.b64" > "${RUNNER_TEMP}/nexora-v090.patch.xz"
          echo "04fd41e6759cbf7be4edd6edc133401178adb2112a1776c75f0eb393bc7d9afb  ${RUNNER_TEMP}/nexora-v090.patch.xz" | sha256sum --check -
          xz --test "${RUNNER_TEMP}/nexora-v090.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/nexora-v090.patch.xz" > "${RUNNER_TEMP}/nexora-v090.patch"
          cd "${PROJECT_DIR}"
          patch --batch --forward -p1 < "${RUNNER_TEMP}/nexora-v090.patch"
          patch --batch --forward -p1 < "${GITHUB_WORKSPACE}/project-payload/NEXORA_v0.9.0-package-identity.patch"
          cat \
            "${GITHUB_WORKSPACE}/project-payload/NEXORA_v0.9.0_icon.png.b64.part-00" \
            "${GITHUB_WORKSPACE}/project-payload/NEXORA_v0.9.0_icon.png.b64.part-01" \
            "${GITHUB_WORKSPACE}/project-payload/NEXORA_v0.9.0_icon.png.b64.part-02" \
            "${GITHUB_WORKSPACE}/project-payload/NEXORA_v0.9.0_icon.png.b64.part-03" \
            "${GITHUB_WORKSPACE}/project-payload/NEXORA_v0.9.0_icon.png.b64.part-04" \
            > "${RUNNER_TEMP}/nexora-icon.png.b64"
          base64 --decode "${RUNNER_TEMP}/nexora-icon.png.b64" > "${RUNNER_TEMP}/nexora-icon.png"
          echo "3e800826c1c796c3e8c3cc9342346ef3ba3032eced361fef2842d4caf04d7f7c  ${RUNNER_TEMP}/nexora-icon.png" | sha256sum --check -
          install -m 0644 "${RUNNER_TEMP}/nexora-icon.png" "${PROJECT_DIR}/assets/app_icon.png"
          rm -f "${PROJECT_DIR}/assets/app_icon.png.import"
          godot --headless --editor --path . --quit
          grep -qx 'config/name="NEXORA | نيكسورا - عوالم متحدة"' project.godot
          grep -qx 'config/version="0.9.0"' project.godot
          grep -qx 'version/name="0.9.0"' export_presets.cfg
          grep -qx 'version/code=16' export_presets.cfg
          grep -qx 'package/name="NEXORA"' export_presets.cfg
          grep -qx 'package/unique_name="com.nexora.worlds"' export_presets.cfg
          grep -qx 'permissions/internet=false' export_presets.cfg
          grep -q 'class_name NexoraState' scripts/game_state.gd
          grep -q 'func _mode_tile' scripts/main.gd
          [[ "$(grep -c '_mode_tile(modes_grid' scripts/main.gd)" -eq 6 ]]
          ! grep -q 'Lucky Pull' scripts/main.gd
          test -s assets/app_icon.png

      - name: Apply NEXORA 1.0.0 Luck Cards update
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "${GITHUB_WORKSPACE}/NEXORA_v1.0.0_luck_cards.patch.xz.b64" > "${RUNNER_TEMP}/nexora-v100.patch.xz"
          echo "632f0a8408c89050b64b6f09514b396a602e781275836f0d71242fb6bc10795f  ${RUNNER_TEMP}/nexora-v100.patch.xz" | sha256sum --check -
          xz --test "${RUNNER_TEMP}/nexora-v100.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/nexora-v100.patch.xz" > "${RUNNER_TEMP}/nexora-v100.patch"
          cd "${PROJECT_DIR}"
          patch --batch --forward -p1 < "${RUNNER_TEMP}/nexora-v100.patch"
          grep -qx 'config/version="1.0.0"' project.godot
          grep -qx 'version/name="1.0.0"' export_presets.cfg
          grep -qx 'version/code=17' export_presets.cfg
          grep -qx 'permissions/internet=false' export_presets.cfg
          grep -qx 'const SAVE_VERSION := 10' scripts/game_state.gd
          grep -q 'LUCK_CARD_ODDS' scripts/game_state.gd
          grep -q 'LUCK_CARD_PITY_THRESHOLDS' scripts/game_state.gd
          grep -q 'func try_luck_card_reward' scripts/game_state.gd
          grep -q 'func get_luck_pity_info' scripts/game_state.gd
          grep -q 'daily_elite_wins' scripts/game_state.gd
          grep -q 'بطاقات الحظ' scripts/main.gd
          ! grep -q 'Lucky Pull' scripts/main.gd
          godot --headless --editor --path . --quit

      - name: Run automated game and save tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          godot --headless --path . --script res://tests/save_recovery_test.gd

      - name: Upload reconstructed source for test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-v1.0.0-Reconstructed-Project
          path: .build-source/LuckyPull_Godot4
          if-no-files-found: error
          retention-days: 7

      - name: Launch main game scene
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          godot --headless --path . --quit-after 5

      - name: Create temporary Android debug key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -v \
            -keystore "${RUNNER_TEMP}/luckypull-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=NEXORA,C=IQ"

      - name: Export and verify APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/luckypull-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" "build/NEXORA-Android-v1.0.0.apk"
          test -s build/NEXORA-Android-v1.0.0.apk
          unzip -t build/NEXORA-Android-v1.0.0.apk >/dev/null
          APK_SHA256="$(sha256sum build/NEXORA-Android-v1.0.0.apk | awk '{print $1}')"
          APK_SIGNER=""
          if [[ -n "${ANDROID_HOME:-}" && -x "${ANDROID_HOME}/build-tools/34.0.0/apksigner" ]]; then
            APK_SIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          elif command -v apksigner >/dev/null 2>&1; then
            APK_SIGNER="$(command -v apksigner)"
          else
            APK_SIGNER="$(find /root /opt /usr/lib -type f -name apksigner -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          test -n "${APK_SIGNER}"
          "${APK_SIGNER}" verify --verbose build/NEXORA-Android-v1.0.0.apk
          printf '### NEXORA 1.0.0 APK\n\n- Godot import, automated tests, scene launch: passed\n- APK export and signature verification: passed\n- SHA-256: `%s`\n' "${APK_SHA256}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload installable APK only
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-v1.0.0-Android-Debug-APK
          path: .build-source/LuckyPull_Godot4/build/NEXORA-Android-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
