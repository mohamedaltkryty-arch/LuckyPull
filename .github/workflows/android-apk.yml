name: Build Lucky Pull Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucky-pull-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Godot 4.3 Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3"
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$(dirname "${TEMPLATE_TARGET}")" "${HOME}/.config"
          if [[ -d "${TEMPLATE_SOURCE}" && "${TEMPLATE_SOURCE}" != "${TEMPLATE_TARGET}" ]]; then
            cp -a "${TEMPLATE_SOURCE}" "${TEMPLATE_TARGET}"
          fi
          if [[ -d /root/.config/godot && ! -d "${HOME}/.config/godot" ]]; then
            cp -a /root/.config/godot "${HOME}/.config/godot"
          fi
          command -v godot
          godot --version
          java -version
          keytool -help >/dev/null 2>&1
          test -f "${TEMPLATE_TARGET}/android_debug.apk"

      - name: Reconstruct v0.3.4 base project
        shell: bash
        run: |
          set -euo pipefail
          cat project-payload/LuckyPull_Godot4_v0.3.4.tar.gz.b64 > LuckyPull_Godot4_Project.tar.gz.b64
          base64 --decode LuckyPull_Godot4_Project.tar.gz.b64 > LuckyPull_Godot4_Project.tar.gz
          echo "3036ab7733b3727a4f0420def64cf2ef7c88e90b19f773f0db07b15e8150fa5e  LuckyPull_Godot4_Project.tar.gz" | sha256sum --check
          tar -tzf LuckyPull_Godot4_Project.tar.gz | grep -Fx "LuckyPull_Godot4/project.godot"
          mkdir -p .build-source
          tar -xzf LuckyPull_Godot4_Project.tar.gz -C .build-source
          test -f .build-source/LuckyPull_Godot4/project.godot
          echo "PROJECT_DIR=${GITHUB_WORKSPACE}/.build-source/LuckyPull_Godot4" >> "${GITHUB_ENV}"

      - name: Apply v0.4.0 card collections and pity patch
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${GITHUB_WORKSPACE}/.build-source/LuckyPull_Godot4"
          PATCH_XZ="${RUNNER_TEMP}/luckypull-v0.4.0.patch.xz"
          PATCH_FILE="${RUNNER_TEMP}/luckypull-v0.4.0.patch"
          base64 --decode project-payload/LuckyPull-v0.4.0.patch.xz.b64 > "${PATCH_XZ}"
          xz --test "${PATCH_XZ}"
          xz --decompress --stdout "${PATCH_XZ}" > "${PATCH_FILE}"
          cd "${PROJECT_DIR}"
          patch --batch --forward --strip=1 --dry-run < "${PATCH_FILE}"
          patch --batch --forward --strip=1 < "${PATCH_FILE}"
          grep -q '^config/version="0.4.0"$' project.godot
          grep -q '^version/name="0.4.0"$' export_presets.cfg
          grep -q '^version/code=5$' export_presets.cfg
          grep -q 'CARD_COLLECTIONS' scripts/game_state.gd
          echo "Applied v0.4.0 patch."

      - name: Normalize Android export preset and validate project
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          sed -i -E 's|^gradle_build/min_sdk=.*$|gradle_build/min_sdk=""|' export_presets.cfg
          sed -i -E 's|^gradle_build/target_sdk=.*$|gradle_build/target_sdk=""|' export_presets.cfg
          grep -q '^textures/vram_compression/import_etc2_astc=' project.godot || \
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          rm -rf .godot/imported
          godot --headless --editor --path . --quit
          test -s assets/fonts/NotoSansArabic-Regular.ttf
          test -s assets/fonts/NotoSansArabic-SemiBold.ttf
          test -s assets/fonts/NotoSansArabic-Bold.ttf
          test -s assets/fonts/NotoSansSymbols2-Regular.ttf
          grep -q 'theme/default_font="res://assets/fonts/NotoSansArabic-Regular.ttf"' project.godot
          grep -q '^config/version="0.4.0"$' project.godot
          grep -q '^version/name="0.4.0"$' export_presets.cfg
          grep -q '^version/code=5$' export_presets.cfg
          grep -q 'var save_recovery_blocked: bool = false' scripts/game_state.gd
          grep -q 'CARD_COLLECTIONS' scripts/game_state.gd
          test -s tests/save_recovery_test.gd

      - name: Test save recovery, card collections, and published odds
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          godot --headless --path . --script res://tests/save_recovery_test.gd

      - name: Launch game scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          godot --headless --path . --quit-after 3

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}"
          keytool -genkeypair -noprompt -v \
            -keystore "${RUNNER_TEMP}/luckypull-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Lucky Pull,C=IQ"

      - name: Export and verify Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/luckypull-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" "build/LuckyPull-Android.apk"
          test -s build/LuckyPull-Android.apk
          unzip -t build/LuckyPull-Android.apk >/dev/null
          sha256sum build/LuckyPull-Android.apk
          APK_SIGNER=""
          if [[ -n "${ANDROID_HOME:-}" && -x "${ANDROID_HOME}/build-tools/34.0.0/apksigner" ]]; then
            APK_SIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          elif command -v apksigner >/dev/null 2>&1; then
            APK_SIGNER="$(command -v apksigner)"
          else
            APK_SIGNER="$(find /root /opt /usr/lib -type f -name apksigner -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          test -n "${APK_SIGNER}"
          "${APK_SIGNER}" verify --verbose build/LuckyPull-Android.apk

      - name: Package patched Godot source
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.build-source"
          zip -qr "${GITHUB_WORKSPACE}/LuckyPull-Godot4-v0.4.0-Source.zip" LuckyPull_Godot4
          test -s "${GITHUB_WORKSPACE}/LuckyPull-Godot4-v0.4.0-Source.zip"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyPull-v0.4.0-Android-Debug-APK
          path: .build-source/LuckyPull_Godot4/build/LuckyPull-Android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload patched Godot source
        uses: actions/upload-artifact@v4
        with:
          name: LuckyPull-Godot4-v0.4.0-Source
          path: LuckyPull-Godot4-v0.4.0-Source.zip
          if-no-files-found: error
          retention-days: 14
