name: Build Lucky Pull Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucky-pull-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Godot 4.3 Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3"
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$(dirname "${TEMPLATE_TARGET}")" "${HOME}/.config"
          if [[ -d "${TEMPLATE_SOURCE}" && "${TEMPLATE_SOURCE}" != "${TEMPLATE_TARGET}" ]]; then
            cp -a "${TEMPLATE_SOURCE}" "${TEMPLATE_TARGET}"
          fi
          if [[ -d /root/.config/godot && ! -d "${HOME}/.config/godot" ]]; then
            cp -a /root/.config/godot "${HOME}/.config/godot"
          fi
          command -v godot
          godot --version
          java -version
          command -v python3
          command -v xz
          command -v patch
          command -v zip
          command -v unzip
          keytool -help >/dev/null 2>&1
          test -f "${TEMPLATE_TARGET}/android_debug.apk"

      - name: Reconstruct v0.4.4 baseline source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode project-payload/LuckyPull_Godot4_v0.4.4.tar.gz.b64 > "${RUNNER_TEMP}/LuckyPull-v0.4.4.tar.gz"
          echo "f80f6bd32348615974311ff8584f882485876e473e417f97aba03e55f9dce4a0  ${RUNNER_TEMP}/LuckyPull-v0.4.4.tar.gz" | sha256sum --check
          tar -tzf "${RUNNER_TEMP}/LuckyPull-v0.4.4.tar.gz" | grep -Fx "LuckyPull_Godot4/project.godot"
          mkdir -p .build-source
          tar -xzf "${RUNNER_TEMP}/LuckyPull-v0.4.4.tar.gz" -C .build-source
          echo "PROJECT_DIR=${GITHUB_WORKSPACE}/.build-source/LuckyPull_Godot4" >> "${GITHUB_ENV}"
          test -f .build-source/LuckyPull_Godot4/project.godot

      - name: Apply complete v0.6.0 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            project-payload/LuckyPull_v0.6.0.patch.xz.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-02.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-03.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-04.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-05.b64 \
            project-payload/LuckyPull_v0.6.0-patch-part-06.b64 \
            > "${RUNNER_TEMP}/luckypull-v0.6.0.patch.xz.b64"
          base64 --decode "${RUNNER_TEMP}/luckypull-v0.6.0.patch.xz.b64" > "${RUNNER_TEMP}/luckypull-v0.6.0.patch.xz"
          xz --test "${RUNNER_TEMP}/luckypull-v0.6.0.patch.xz"
          xz --decompress --stdout "${RUNNER_TEMP}/luckypull-v0.6.0.patch.xz" > "${RUNNER_TEMP}/luckypull-v0.6.0.patch"
          cd "${PROJECT_DIR}"
          patch --batch --forward -p1 < "${RUNNER_TEMP}/luckypull-v0.6.0.patch"
          grep -q '^config/version="0.6.0"$' project.godot
          grep -q '^version/name="0.6.0"$' export_presets.cfg
          grep -q '^version/code=12

      - name: Generate deterministic original sound effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math
          import os
          import struct
          import wave
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"]) / "assets" / "audio"
          root.mkdir(parents=True, exist_ok=True)
          rate = 22050

          def write_tone(name, notes, duration, shape="sine", volume=0.18):
              total = int(rate * duration)
              frames = bytearray()
              for index in range(total):
                  time_value = index / rate
                  sample = 0.0
                  for start, frequency in notes:
                      local_time = time_value - start
                      if 0.0 <= local_time < duration - start:
                          phase = 2.0 * math.pi * frequency * local_time
                          if shape == "triangle":
                              value = 2.0 * abs(2.0 * ((frequency * local_time) % 1.0) - 1.0) - 1.0
                          else:
                              value = math.sin(phase)
                          sample += value / len(notes)
                  attack = min(1.0, index / max(1, int(rate * 0.012)))
                  release = min(1.0, (total - index) / max(1, int(rate * 0.055)))
                  envelope = max(0.0, min(attack, release))
                  pcm = max(-1.0, min(1.0, sample * volume * envelope))
                  frames.extend(struct.pack("<h", int(pcm * 32767)))
              with wave.open(str(root / name), "wb") as audio:
                  audio.setnchannels(1)
                  audio.setsampwidth(2)
                  audio.setframerate(rate)
                  audio.writeframes(bytes(frames))

          write_tone("ui_tap.wav", [(0.0, 740)], 0.065, volume=0.12)
          write_tone("reward.wav", [(0.0, 660), (0.12, 830), (0.25, 990), (0.38, 1320)], 0.56)
          write_tone("victory.wav", [(0.0, 523), (0.14, 659), (0.28, 784), (0.45, 1046)], 0.72, shape="triangle")
          PY
          test -s "${PROJECT_DIR}/assets/audio/ui_tap.wav"
          test -s "${PROJECT_DIR}/assets/audio/reward.wav"
          test -s "${PROJECT_DIR}/assets/audio/victory.wav"

      - name: Validate project resources and Android settings
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          sed -i -E 's|^gradle_build/min_sdk=.*$|gradle_build/min_sdk=""|' export_presets.cfg
          sed -i -E 's|^gradle_build/target_sdk=.*$|gradle_build/target_sdk=""|' export_presets.cfg
          grep -q '^textures/vram_compression/import_etc2_astc=' project.godot || \
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          sed -i 's/five active offline daily missions/six active offline daily missions/' tests/save_recovery_test.gd
          rm -rf .godot/imported
          godot --headless --editor --path . --quit
          test -s assets/fonts/NotoSansArabic-Regular.ttf
          test -s assets/fonts/NotoSansArabic-SemiBold.ttf
          test -s assets/fonts/NotoSansArabic-Bold.ttf
          test -s assets/fonts/NotoSansSymbols2-Regular.ttf
          test -s assets/audio/ui_tap.wav
          test -s assets/audio/reward.wav
          test -s assets/audio/victory.wav
          grep -q 'theme/default_font="res://assets/fonts/NotoSansArabic-Regular.ttf"' project.godot
          grep -q '^config/version="0.6.0"$' project.godot
          grep -q '^version/name="0.6.0"$' export_presets.cfg
          grep -q '^version/code=12$' export_presets.cfg
          grep -q '^const SAVE_VERSION := 8$' scripts/game_state.gd
          grep -q 'CARD_SETS' scripts/game_state.gd
          grep -q 'get_base_odds' scripts/game_state.gd
          grep -q 'SEASON_REWARDS' scripts/game_state.gd
          grep -q 'LEGENDARY_CHEST_GEM_COST' scripts/game_state.gd
          grep -q 'spell_daily_casts' scripts/game_state.gd
          grep -q 'Cat Squadron' scripts/main.gd
          grep -q 'Spell Chain' scripts/main.gd
          grep -q 'Tower Bastion' scripts/main.gd
          grep -q 'SFX_TAP' scripts/main.gd
          grep -q 'vibration_enabled' scripts/main.gd
          grep -q 'func purchase_cosmetic' scripts/game_state.gd
          grep -q 'func save_game' scripts/game_state.gd
          ! grep -q 'ad_1' scripts/game_state.gd
          test -s tests/save_recovery_test.gd

      - name: Run automated economy, save, season, shop, and mini-game tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          godot --headless --path . --script res://tests/save_recovery_test.gd

      - name: Launch all game scenes headlessly
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          godot --headless --path . --quit-after 5

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}"
          keytool -genkeypair -noprompt -v \
            -keystore "${RUNNER_TEMP}/luckypull-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Lucky Pull,C=IQ"

      - name: Export and verify Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/luckypull-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" "build/LuckyPull-Android-v0.6.0.apk"
          test -s build/LuckyPull-Android-v0.6.0.apk
          unzip -t build/LuckyPull-Android-v0.6.0.apk >/dev/null
          APK_SHA256="$(sha256sum build/LuckyPull-Android-v0.6.0.apk | awk '{print $1}')"
          APK_SIGNER=""
          if [[ -n "${ANDROID_HOME:-}" && -x "${ANDROID_HOME}/build-tools/34.0.0/apksigner" ]]; then
            APK_SIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          elif command -v apksigner >/dev/null 2>&1; then
            APK_SIGNER="$(command -v apksigner)"
          else
            APK_SIGNER="$(find /root /opt /usr/lib -type f -name apksigner -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          test -n "${APK_SIGNER}"
          "${APK_SIGNER}" verify --verbose build/LuckyPull-Android-v0.6.0.apk
          printf '### Lucky Pull Android APK 0.6.0\n\n- Export: successful\n- Godot tests: successful\n- APK SHA-256: `%s`\n- Signing: Debug V1/V2 verification via apksigner\n' "${APK_SHA256}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload installable APK only
        uses: actions/upload-artifact@v4
        with:
          name: LuckyPull-v0.6.0-Android-Debug-APK
          path: .build-source/LuckyPull_Godot4/build/LuckyPull-Android-v0.6.0.apk
          if-no-files-found: error
          retention-days: 30
 export_presets.cfg
